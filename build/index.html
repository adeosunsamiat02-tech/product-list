<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desserts</title>
  <link rel="stylesheet" href="./css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-Rose50 font-sans min-h-screen">

  <main class="max-w-7xl mx-auto p-6 lg:p-20 grid lg:grid-cols-[1fr_380px] gap-8 items-start">

    <div>
      <h1 class="text-4xl font-bold text-Rose900 mb-8">Desserts</h1>
      <div id="products" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-12"></div>
    </div>

    <div class="bg-white rounded-xl p-6 sticky top-6">
      <h2 class="text-Red font-bold text-xl mb-4">Your Cart (<span id="cart-count">0</span>)</h2>
      
      <div id="cart-empty" class="py-8 text-center">
        <img src="./img/illustration-empty-cart.svg" alt="" class="mx-auto mb-4">
        <p class="text-sm text-Rose500 font-semibold">Your added items will appear here</p>
      </div>

      <div id="cart-filled" class="hidden">
        <div id="cart-items"></div>
        <div class="flex justify-between items-center pt-6 pb-4">
          <p class="text-sm text-Rose900">Order Total</p>
          <p id="order-total" class="text-2xl font-bold text-Rose900">$0.00</p>
        </div>
        <div class="bg-Rose50 flex items-center justify-center gap-2 py-3 rounded-lg mb-6">
          <img src="./img/icon-carbon-neutral.svg" alt="">
          <p class="text-sm text-Rose900">This is a <span class="font-semibold">carbon-neutral</span> delivery</p>
        </div>
        <button id="confirm-btn" class="w-full bg-Red text-white py-4 rounded-full font-semibold hover:opacity-90 transition">Confirm Order</button>
      </div>
    </div>

  </main>

  <div id="modal" class="hidden fixed inset-0 bg-black/50 place-items-center p-4 z-50">
    <div class="bg-white rounded-xl p-8 w-full max-w-[500px] max-h-[90vh] overflow-auto">
      <img src="./img/icon-order-confirmed.svg" alt="" class="mb-4">
      <h2 class="text-3xl font-bold text-Rose900">Order Confirmed</h2>
      <p class="text-Rose400 text-sm mt-2 mb-6">We hope you enjoy your food!</p>
      <div class="bg-Rose50 rounded-lg p-6">
        <div id="modal-items" class="max-h-[200px] overflow-auto pr-2"></div>
        <div class="flex justify-between items-center pt-6">
          <p class="text-sm text-Rose900">Order Total</p>
          <p id="modal-total" class="text-2xl font-bold text-Rose900"></p>
        </div>
      </div>
      
      <button id="new-order" class="w-full bg-Red text-white py-4 rounded-full font-semibold mt-8">Start New Order</button>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
